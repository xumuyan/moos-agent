[package]
name = "moos-desktop"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "moos-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.release.build-override]
strip = false
