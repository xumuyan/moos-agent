<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'">
  <title>Moos 模型服务</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px/1.45 system-ui, sans-serif;
      --model-surface: Canvas;
      --model-field: light-dark(#fff, #20232b);
      --model-text: CanvasText;
      --model-muted: light-dark(#51596b, #b1b7c7);
      --model-border: light-dark(#c5cbd8, #555e71);
      --model-accent: light-dark(#4e61ac, #9aaaf1);
      background: Canvas;
      scrollbar-width: thin;
      scrollbar-color: var(--model-border) transparent;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 22px clamp(18px, 4vw, 30px);
      background: var(--model-surface);
      color: var(--model-text);
    }
    main { max-width: 570px; margin-inline: auto; }
    header { margin-bottom: 18px; }
    h1 { margin: 0 0 5px; font-size: 21px; line-height: 1.3; }
    header p { margin: 0; color: var(--model-muted); }
    form { display: grid; gap: 10px; }
    label { display: grid; min-width: 0; gap: 4px; font-weight: 500; }
    input, select, button {
      min-height: 34px;
      min-width: 0;
      border: 1px solid var(--model-border);
      border-radius: 8px;
      background: var(--model-field);
      color: inherit;
      font: inherit;
      padding: 5px 10px;
    }
    input::placeholder { color: var(--model-muted); opacity: 1; }
    :is(input, select, button):focus-visible { outline: 2px solid var(--model-accent); outline-offset: 2px; }
    select:disabled { opacity: .65; }
    button { cursor: pointer; padding-inline: 16px; font-weight: 600; }
    button:enabled:hover { border-color: var(--model-accent); }
    button:disabled { opacity: .55; cursor: default; }
    button[type="submit"] {
      border-color: var(--model-accent);
      background: color-mix(in srgb, var(--model-accent) 18%, var(--model-field));
    }
    button[type="submit"]:enabled:hover {
      background: color-mix(in srgb, var(--model-accent) 26%, var(--model-field));
    }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .check { display: flex; align-items: center; gap: 8px; min-height: 26px; }
    .check input { min-height: auto; width: 15px; height: 15px; margin: 0; accent-color: var(--model-accent); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--model-border);
    }
    #status { color: var(--model-muted); overflow-wrap: anywhere; }
    #status:empty { display: none; }
    @media (max-width: 390px) { .pair { grid-template-columns: 1fr; } }
  </style>
  <script src="./model-settings.js" defer></script>
</head>
<body>
  <main>
  <header>
    <h1>模型服务</h1>
    <p>为 PI 配置模型、连接方式和推理档位。</p>
  </header>
  <form>
    <label>配置<select id="profiles"><option value="">新增配置</option></select></label>
    <label>显示名称<input name="name" required maxlength="200"></label>
    <label>服务地址<input name="baseUrl" type="url" required placeholder="https://example.com/v1"></label>
    <label>模型 ID<input name="model" required maxlength="200"></label>
    <div class="pair">
      <label>服务类型<select name="service">
        <option value="openai">OpenAI 兼容</option><option value="glm">GLM Coding Plan</option>
        <option value="deepseek">DeepSeek</option>
      </select></label>
      <label>协议<select name="api">
        <option value="openai-responses">Responses</option><option value="openai-completions">Chat Completions</option>
      </select></label>
    </div>
    <div class="pair">
      <label>推理档位<select name="thinkingLevel">
        <option value="off">关闭</option><option value="minimal">Minimal</option><option value="low">Low</option>
        <option value="medium">Medium</option><option value="high">High</option><option value="xhigh">XHigh</option>
      </select></label>
      <label>上下文窗口<input name="contextWindow" type="number" min="1" max="10000000" value="128000" required></label>
    </div>
    <label class="check"><input name="imageInput" type="checkbox">启用已验证的图片输入</label>
    <label>API 密钥<input name="apiKey" type="password" maxlength="16384" autocomplete="off" placeholder="修改现有配置时留空保留"></label>
    <div class="actions">
      <button type="button" id="test-connection">测试连接</button>
      <button type="submit">保存</button>
    </div>
    <div id="status" role="status"></div>
  </form>
  </main>
</body>
</html>
