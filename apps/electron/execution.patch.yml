# Apply after the writable profile and home patches. Existing sessions keep
# their preset IDs, but the original built-in presets no longer mount tools.
- id: preset-standard
  config: { id: standard, order: 1, plugins: [] }
- id: preset-ptc
  config: { id: ptc, order: 2, plugins: [] }
- id: preset-minimal
  config: { id: minimal, order: 3, plugins: [] }
- id: preset-cordis
  config: { id: cordis, order: 4, plugins: [] }
- id: tool-executor-native
  disabled: true
- id: tool-executor-ptc
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: ptc-runtime
  disabled: true
- id: cordis-host-runner
  disabled: true
- id: cordis-client-runner
  disabled: true
- id: cordis-inspect-providers
  disabled: true
- id: ui-cordis
  disabled: true
- id: harness-dev-context
  disabled: true
- id: schedule
  disabled: true
- id: ui-schedule
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: agent-default-model
  config: { provider: moos-pi, model: auto }
- id: directory-picker
  disabled: true
- insert:
    - id: moos-directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: moos-directory-picker-browser-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# The workbench keeps its core views and package installer. Optional upstream
# tools and their settings are not part of the default Moos composition.
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: terminal-controller
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-browser
  disabled: true
- id: office-to-pdf
  disabled: true
- id: ui-sidebar-documentpreview
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: mcp-resources
  disabled: true
- id: ui-skill
  disabled: true
- id: subagent-model-selection-settings
  disabled: true
- id: ui-subagent
  disabled: true
# ui-permission：composer 三档权限菜单与 /permission 选择器（仅查看/工作区内/完全权限）。
# 执行权限实际由设置页「命令执行」卡统一控制（execution-policy.json 覆盖 sandboxPolicy），
# 菜单选择会被覆盖形成假 UI，用户 2026-11-12 决定移除（E134）。
- id: ui-permission
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: goal-round-driver
  disabled: true
- id: ui-goal
  disabled: true
- id: job-controller
  disabled: true
- id: ui-jobs
  disabled: true
